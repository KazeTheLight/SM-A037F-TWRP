name: Build TWRP

on:
  workflow_dispatch:
    inputs:
      assets:
        description: "Prebuilt kernel + DTB + DTBO set"
        required: true
        type: choice
        options:
          - proven
          - physwizz
          - cye1
        default: proven
      create_release:
        description: "Publish recovery.img and recovery.tar as a GitHub release"
        required: true
        type: boolean
        default: true
      dirty_build:
        description: "Reuse the previous out/ cache (incremental build, faster)"
        required: true
        type: boolean
        default: false

permissions:
  contents: write

env:
  MANIFEST_URL: https://github.com/minimal-manifest-twrp/platform_manifest_twrp_aosp
  MANIFEST_BRANCH: twrp-12.1
  DEVICE: a03s
  DEVICE_PATH: device/samsung/a03s

jobs:
  build:
    name: TWRP 12.1 / ${{ inputs.assets }} assets
    runs-on: ubuntu-22.04
    timeout-minutes: 360

    steps:
      - name: Check out device tree
        uses: actions/checkout@v4
        with:
          path: device-tree
          fetch-depth: 1

      - name: Free disk space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: false

      - name: Show disk space
        run: df -h /

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            bc bison build-essential ccache curl flex g++-multilib gcc-multilib \
            gcc-10-multilib g++-10-multilib git gnupg gperf imagemagick \
            lib32ncurses-dev lib32readline-dev lib32z1-dev libbz2-dev libc6-dev \
            libc6-dev-i386 libelf-dev libgl1-mesa-dev libglu1-mesa-dev freeglut3-dev \
            liblz4-tool libncurses-dev libncurses6 libsdl1.2-dev libssl-dev \
            libstdc++-10-dev libxml2 libxml2-utils lzop ncftp pngcrush \
            qemu-user-static rsync schedtool squashfs-tools tree xsltproc zip \
            zlib1g-dev python3 python-is-python3

      - name: Set up Java 11
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "11"

      - name: Install repo
        run: |
          mkdir -p "$HOME/bin"
          curl -fsSL https://storage.googleapis.com/git-repo-downloads/repo -o "$HOME/bin/repo"
          chmod +x "$HOME/bin/repo"
          echo "$HOME/bin" >> "$GITHUB_PATH"

      - name: Sync TWRP source
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          mkdir -p workspace
          cd workspace
          repo init --depth=1 -u "$MANIFEST_URL" -b "$MANIFEST_BRANCH"
          repo sync -c -j"$(nproc --all)" --force-sync --no-tags

      - name: Record source revision
        id: source
        working-directory: ${{ github.workspace }}/workspace
        run: |
          set -eo pipefail
          HASH=$({ repo forall -c 'git rev-parse HEAD'; git -C .repo/manifests rev-parse HEAD; } | sort | sha256sum | cut -d' ' -f1)
          echo "hash=$HASH" >> "$GITHUB_OUTPUT"
          echo "Source hash: $HASH"
          rm -rf .repo

      - name: Install device tree
        run: |
          mkdir -p "workspace/$DEVICE_PATH"
          cp -a device-tree/. "workspace/$DEVICE_PATH/"
          rm -rf "workspace/$DEVICE_PATH/.git" "workspace/$DEVICE_PATH/.github"
          test -f "workspace/$DEVICE_PATH/BoardConfig.mk"

      - name: Select prebuilt assets
        run: |
          cd "workspace/$DEVICE_PATH/prebuilt"
          case "${{ inputs.assets }}" in
            physwizz)
              cp Image.physwizz Image
              cp recovery.img-dtb.physwizz recovery.img-dtb
              echo "Using physwizz kernel + physwizz DTB"
              ;;
            cye1)
              cp Image.stock Image
              cp recovery.img-dtb.cye1 recovery.img-dtb
              cp recovery_dtbo.c3 recovery_dtbo
              echo "Using stock A037FXXS8CYE1 kernel + DTB"
              ;;
            *)
              echo "Using the proven kernel/DTB/DTBO currently installed on the device"
              ;;
          esac
          sha256sum Image recovery.img-dtb recovery_dtbo

      - name: Build mode
        run: |
          echo "Dirty build: ${{ inputs.dirty_build }}; assets: ${{ inputs.assets }}"

      - name: Restore previous build output
        if: ${{ inputs.dirty_build }}
        id: out_cache
        uses: actions/cache/restore@v4
        with:
          path: workspace/out
          key: twrp-out-${{ runner.os }}-${{ github.ref_name }}-${{ inputs.assets }}-${{ steps.source.outputs.hash }}
          restore-keys: |
            twrp-out-${{ runner.os }}-${{ github.ref_name }}-${{ inputs.assets }}-${{ steps.source.outputs.hash }}-

      - name: Prepare dirty build
        if: ${{ inputs.dirty_build }}
        run: |
          set -eo pipefail
          if [ -d workspace/out ]; then
            du -sh workspace/out || true
            rm -f "workspace/out/target/product/$DEVICE/recovery.img" \
                  "workspace/out/target/product/$DEVICE/recovery.tar" \
                  "workspace/out/target/product/$DEVICE/SHA256SUMS.txt"
            echo "Reusing previous out/; touching source mtimes..."
            ( cd workspace && find . -path ./out -prune -o -type f -exec touch -t 200001010000.00 {} + )
            ( cd workspace && find "device/samsung/a03s" -type f -exec touch {} + )
            echo "Dirty build prepared."
          else
            echo "No previous out/ restored; this will be a full build."
          fi

      - name: Build recovery
        working-directory: ${{ github.workspace }}/workspace
        run: |
          set -eo pipefail
          source build/envsetup.sh
          export ALLOW_MISSING_DEPENDENCIES=true
          export LC_ALL=C
          export TZ=UTC
          lunch twrp_a03s-eng
          mka recoveryimage 2>&1 | tee build.log

      - name: Measure build output
        id: out_size
        if: success()
        run: |
          SIZE=$(du -sm workspace/out | cut -f1)
          echo "out size: ${SIZE} MB"
          echo "size=$SIZE" >> "$GITHUB_OUTPUT"
          if [ "$SIZE" -le 14000 ]; then
            echo "save=true" >> "$GITHUB_OUTPUT"
          else
            echo "save=false" >> "$GITHUB_OUTPUT"
            echo "::warning::out/ is ${SIZE} MB; cache checkpoint skipped (limit 14000 MB)"
          fi

      - name: Save build output cache
        if: ${{ success() && steps.out_size.outputs.save == 'true' }}
        uses: actions/cache/save@v4
        continue-on-error: true
        with:
          path: workspace/out
          key: twrp-out-${{ runner.os }}-${{ github.ref_name }}-${{ inputs.assets }}-${{ steps.source.outputs.hash }}

      - name: Check and package image
        working-directory: ${{ github.workspace }}/workspace
        run: |
          set -eo pipefail
          OUT="out/target/product/$DEVICE"
          test -f "$OUT/recovery.img"
          SIZE=$(stat -c%s "$OUT/recovery.img")
          LIMIT=38797312
          echo "recovery.img = $SIZE bytes (partition limit $LIMIT)"
          if [ "$SIZE" -gt "$LIMIT" ]; then
            echo "::error::recovery.img exceeds the recovery partition"
            exit 1
          fi
          if [ "$SIZE" -lt "$LIMIT" ]; then
            truncate -s "$LIMIT" "$OUT/recovery.img"
            echo "padded recovery.img to $LIMIT bytes"
          fi
          ( cd "$OUT" && tar --format=ustar -cf recovery.tar recovery.img )
          ( cd "$OUT" && sha256sum recovery.img recovery.tar > SHA256SUMS.txt )
          ls -lh "$OUT/recovery.img" "$OUT/recovery.tar"

      - name: Upload recovery artifact
        uses: actions/upload-artifact@v4
        with:
          name: twrp-a03s-${{ github.run_number }}-${{ inputs.assets }}
          path: |
            workspace/out/target/product/a03s/recovery.img
            workspace/out/target/product/a03s/recovery.tar
            workspace/out/target/product/a03s/SHA256SUMS.txt
          if-no-files-found: error

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log-${{ github.run_number }}
          path: workspace/build.log
          if-no-files-found: ignore
          retention-days: 7

      - name: Create release tag
        if: ${{ inputs.create_release }}
        working-directory: device-tree
        env:
          RELEASE_TAG: twrp-${{ github.run_number }}-${{ github.run_attempt }}
        run: |
          git tag -f "$RELEASE_TAG" "$GITHUB_SHA"
          git push --force origin "refs/tags/$RELEASE_TAG"

      - name: Publish release
        if: ${{ inputs.create_release }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: twrp-${{ github.run_number }}-${{ github.run_attempt }}
          name: TWRP a03s build ${{ github.run_number }}
          prerelease: true
          body: |
            TWRP 12.1 for Samsung Galaxy A03s (SM-A037F)

            - Firmware target: A037FXXS8CYE1 (system properties)
            - Assets: ${{ inputs.assets }}
            - Dirty build: ${{ inputs.dirty_build }}
            - Kernel/DTB/DTBO: selected prebuilt set (see README)
            - Commit: ${{ github.sha }}

            Flash `recovery.tar` with Odin (AP slot) or `recovery.img` with Heimdall.
          files: |
            workspace/out/target/product/a03s/recovery.img
            workspace/out/target/product/a03s/recovery.tar
            workspace/out/target/product/a03s/SHA256SUMS.txt
          token: ${{ secrets.GITHUB_TOKEN }}
